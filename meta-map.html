<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Idol Meta Map — 6 Axis</title>
<style>
:root{--bg:#f7f7f4;--fg:#171717;--muted:#777;--line:#d8d8d2;--card:#fff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif}main{max-width:1180px;margin:auto;padding:32px 24px 48px}h1{margin:0 0 6px;font-size:28px}.sub{color:var(--muted);margin-bottom:18px}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.controls label{font-size:13px;font-weight:700}.controls select{padding:9px 34px 9px 10px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:14px}.map{position:relative;height:650px;background:var(--card);border:1px solid var(--line);overflow:hidden}.axis-x,.axis-y{position:absolute;background:var(--line)}.axis-x{left:8%;right:5%;top:50%;height:1px}.axis-y{top:6%;bottom:10%;left:50%;width:1px}.xl,.xr,.yt,.yb{position:absolute;color:var(--muted);font-size:13px}.xl{left:8%;bottom:4%}.xr{right:5%;bottom:4%}.yt{left:calc(50% + 12px);top:6%}.yb{left:calc(50% + 12px);bottom:10%}.points{position:absolute;inset:6% 5% 10% 8%}.point{position:absolute;transform:translate(-50%,-50%);cursor:pointer}.dot{width:18px;height:18px;border-radius:50%;background:#111;border:3px solid white;box-shadow:0 1px 5px #999}.label{position:absolute;top:23px;left:50%;transform:translateX(-50%);white-space:nowrap;font-weight:700;font-size:14px}.tip{position:absolute;display:none;z-index:5;left:50%;bottom:32px;transform:translateX(-50%);width:255px;padding:12px;background:#111;color:#fff;border-radius:8px;font-size:12px;line-height:1.55}.point:hover .tip{display:block}.legend{margin-top:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card{background:var(--card);border:1px solid var(--line);padding:14px}.card h2{font-size:16px;margin:0 0 7px}.card p{margin:3px 0;color:#555;font-size:13px}.score{font-variant-numeric:tabular-nums;color:#111;font-weight:700}.method{margin-top:20px;color:var(--muted);font-size:12px;line-height:1.6}@media(max-width:800px){.map{height:560px}.legend{grid-template-columns:1fr 1fr}}@media(max-width:520px){main{padding:20px 12px}.map{height:500px}.legend{grid-template-columns:1fr}}
</style></head>
<body><main>
<h1>Idol Meta Map</h1>
<div class="sub">6-axis metadata → 任意の2軸を選択 → 自動2Dマップ</div>
<div class="controls"><label for="xAxis">X軸</label><select id="xAxis"></select><label for="yAxis">Y軸</label><select id="yAxis"></select></div>
<div class="map"><div class="axis-x"></div><div class="axis-y"></div><span class="xl" id="xl"></span><span class="xr" id="xr"></span><span class="yt" id="yt"></span><span class="yb" id="yb"></span><div class="points" id="points"></div></div>
<div class="legend" id="legend"></div>
<div class="method"><b>生成ルール</b>：X/Yは6軸スコアをそのまま0–1座標として使用。軸を変更すると同じSEEDデータから即座に再配置する。値は比較用の初期評価であり、人気順位・市場規模ではない。</div>
</main><script>
const axes={music:'音楽中心度',live:'ライブ／現場活動度',media:'メディア展開度',concept:'コンセプト／物語性',network:'他主体との接続性',expression:'表現形式の多様性'};
const groups=[
{name:'はいどーも！テラスマです！',scores:{music:.45,live:.90,media:.65,concept:.80,network:.75,expression:.95}},
{name:'惑星通信社',scores:{music:.70,live:.90,media:.40,concept:.90,network:.95,expression:.70}},
{name:'エルナン',scores:{music:.75,live:.80,media:.45,concept:.65,network:.55,expression:.60}},
{name:'XG',scores:{music:.95,live:.80,media:.95,concept:.90,network:.90,expression:.95}}
];
const xSelect=document.getElementById('xAxis'),ySelect=document.getElementById('yAxis');
Object.entries(axes).forEach(([k,v])=>{xSelect.add(new Option(v,k));ySelect.add(new Option(v,k))});xSelect.value='music';ySelect.value='expression';
function render(){let x=xSelect.value,y=ySelect.value;if(x===y){y=[...Object.keys(axes)].find(k=>k!==x);ySelect.value=y}document.getElementById('xl').textContent='低 '+axes[x];document.getElementById('xr').textContent='高 '+axes[x];document.getElementById('yt').textContent='高 '+axes[y];document.getElementById('yb').textContent='低 '+axes[y];const points=document.getElementById('points'),legend=document.getElementById('legend');points.innerHTML='';legend.innerHTML='';groups.forEach(g=>{const xv=g.scores[x],yv=g.scores[y];const p=document.createElement('div');p.className='point';p.style.left=xv*100+'%';p.style.top=(1-yv)*100+'%';p.innerHTML=`<div class="dot"></div><div class="label">${g.name}</div><div class="tip"><b>${g.name}</b><br>${axes[x]}：${xv.toFixed(2)}<br>${axes[y]}：${yv.toFixed(2)}</div>`;points.appendChild(p);const c=document.createElement('div');c.className='card';c.innerHTML=`<h2>${g.name}</h2><p>${axes[x]} <span class="score">${xv.toFixed(2)}</span></p><p>${axes[y]} <span class="score">${yv.toFixed(2)}</span></p>`;legend.appendChild(c)})}
xSelect.onchange=render;ySelect.onchange=render;render();
</script></body></html>
